<style>
  #pams{

  #pams #map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--paper);}

  #pams .panel{position:absolute; z-index:1000; background:var(--card); border:1px solid var(--line); box-shadow:0 4px 18px rgba(33,44,54,0.12);}
  #pams #title-panel{top:16px; left:16px; padding:16px 20px; max-width:300px; border-radius:2px;}
  #pams #title-panel h1{color:var(--ink); line-height:1.15; text-transform:none; font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0 0 4px 0; letter-spacing:-0.01em;}
  #pams #title-panel .sub{font-size:12.5px; color:var(--ink-soft); line-height:1.4; margin-bottom:12px;}
  #pams #title-panel .stat-row{display:flex; gap:18px; padding-top:10px; border-top:1px solid var(--line);}
  #pams #title-panel .stat{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  #pams #title-panel .stat b{display:block; font-family:'Inter'; font-size:18px; color:var(--ink); font-weight:700; text-transform:none;}

  #pams #legend-panel{bottom:34px; left:16px; padding:12px 16px; border-radius:2px; font-size:11.5px;}
  #pams #legend-panel .legend-title{text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-size:10.5px; margin-bottom:8px;}
  #pams .scale{display:flex; height:10px; width:200px; border-radius:2px; overflow:hidden; margin-bottom:5px;}
  #pams .scale span{flex:1;}
  #pams .scale-labels{display:flex; justify-content:space-between; color:var(--ink-soft); width:200px;}

  #pams #footer-mark{position:absolute; bottom:6px; left:16px; z-index:1000; font-family:'Fraunces', serif; font-style:italic; font-size:11px; color:var(--ink-soft); opacity:.8; pointer-events:none;}

  #pams .main-st-dot-wrap{background:transparent !important; border:none !important;}
  #pams .main-st-dot{width:9px; height:9px; border-radius:50%; border:1px solid rgba(33,44,54,0.35); box-shadow:0 1px 2px rgba(33,44,54,0.25);}

  #pams .leaflet-popup-content-wrapper{border-radius:3px; padding:0;}
  #pams .leaflet-popup-content{margin:0; width:260px !important;}
  #pams .popup-card{font-family:'Inter'; padding:14px 16px;}
  #pams .popup-eyebrow{text-transform:uppercase; font-size:10px; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:2px;}
  #pams .popup-title{font-family:'Fraunces', serif; font-weight:600; font-size:16px; line-height:1.25; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  #pams .popup-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:12px;}
  #pams .popup-grid .label{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  #pams .popup-grid .value{display:block; font-size:14px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums;}
  #pams .popup-race-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:5px;}
  #pams .race-bar{display:flex; height:8px; width:100%; border-radius:2px; overflow:hidden; margin-bottom:6px;}
  #pams .race-legend{display:flex; flex-wrap:wrap; gap:6px 10px; font-size:10px; color:var(--ink-soft);}
  #pams .race-legend i{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px;}
  #pams .leaflet-control-attribution{font-size:10px; background:rgba(251,250,246,0.85) !important;}

  #pams{position:relative; width:100%; height:680px; isolation:isolate; overflow:hidden;
        font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); line-height:normal;}
  #pams #map-pams{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--paper);}
  #pams .leaflet-container{font-family:'Inter',sans-serif;}
  #pams img{max-width:none !important;}
  @media (max-width:640px){

    #pams #title-panel .sub{display:none;}

  }

        <div><span class="label">Median home value</span><span class="value">${fmtMoney(home)}</span></div>
        <div><span class="label">Median rent</span><span class="value">${fmtMoney(rent)}${rent!==null?'/mo':''}</span></div>
        <div><span class="label">Poverty rate</span><span class="value">${fmtPct(poverty)}</span></div>
        <div><span class="label">Unemployment</span><span class="value">${fmtPct(unemp)}</span></div>
        <div><span class="label">Bachelor's+</span><span class="value">${fmtPct(bach)}</span></div>
      </div>
      <div class="popup-race-label">Race / ethnicity</div>
      <div class="race-bar">
        <div style="width:${white}%;background:#3C6E66"></div>
        <div style="width:${black}%;background:#9C4A2E"></div>
        <div style="width:${hisp}%;background:#D9A544"></div>
        <div style="width:${asian}%;background:#7FA491"></div>
        <div style="width:${other}%;background:#C9BFA0"></div>
      </div>
      <div class="race-legend">
        <span><i style="background:#3C6E66"></i>White ${fmtPct(white)}</span>
        <span><i style="background:#9C4A2E"></i>Black ${fmtPct(black)}</span>
        <span><i style="background:#D9A544"></i>Hispanic ${fmtPct(hisp)}</span>
        <span><i style="background:#7FA491"></i>Asian ${fmtPct(asian)}</span>
        <span><i style="background:#C9BFA0"></i>Other ${fmtPct(other)}</span>
      </div>
    </div>`;
}

for (const rec of DATA) {
  const [lat, lon, , , , , , , , , , , , , , q] = rec;
  const color = COLORS[q] || COLORS[0];
  const icon = L.divIcon({
    className: 'main-st-dot-wrap',
    html: '<div class="main-st-dot" style="background:' + color + '"></div>',
    iconSize: [9, 9]
  });
  const marker = L.marker([lat, lon], { icon: icon });
  marker.bindPopup(popupHtml(rec), { maxWidth: 280 });
  marker.addTo(map);
}
// Squarespace can size the block after load; make sure the map fills it.
window.addEventListener('load', function(){ map.invalidateSize(); });
setTimeout(function(){ map.invalidateSize(); }, 800);
})();
</script>
